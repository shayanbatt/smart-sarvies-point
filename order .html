<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Service - Smart Service Point</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #0879c9;
    color: white;
    text-align: center;
    padding: 25px 10px;
}

.container {
    max-width: 600px;
    margin: 25px auto;
    padding: 20px;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

textarea {
    height: 100px;
    resize: vertical;
}

.whatsapp {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #25D366;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.whatsapp:hover {
    background: #1da851;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #0879c9;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
    <h1>📲 Book a Service</h1>
    <p>Smart Service Point</p>
</header>

<div class="container">

<div class="form-box">

<h2>Service Request</h2>

<form onsubmit="sendWhatsApp(); return false;">

<label>Your Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter mobile number" required>

<label>Select Service</label>

<select id="service" required>
    <option value="">-- Select Service --</option>
    <option>Government Service</option>
    <option>Income Certificate</option>
    <option>Domicile Certificate</option>
    <option>Land Record / Jamabandi</option>
    <option>Fard</option>
    <option>Mutation</option>
    <option>Online Service</option>
    <option>Design Service</option>
    <option>Photo Editing</option>
    <option>Poster Design</option>
    <option>Logo Design</option>
    <option>Printing Service</option>
    <option>Scanning</option>
    <option>Lamination</option>
    <option>Other</option>
</select>

<label>Details / Message</label>

<textarea id="details"
placeholder="Write what service you need..."></textarea>

<button class="whatsapp" type="submit">
    📱 Send Request on WhatsApp
</button>

</form>

<a class="back" href="index.html">
    ⬅️ Back to Home
</a>

</div>

</div>

<script>

function sendWhatsApp() {

    var name = document.getElementById("name").value;
    var mobile = document.getElementById("mobile").value;
    var service = document.getElementById("service").value;
    var details = document.getElementById("details").value;

    var message =
        "📲 New Service Request%0A%0A" +
        "👤 Name: " + encodeURIComponent(name) + "%0A" +
        "📞 Mobile: " + encodeURIComponent(mobile) + "%0A" +
        "🛠️ Service: " + encodeURIComponent(service) + "%0A" +
        "📝 Details: " + encodeURIComponent(details);

    var whatsappNumber = "919596710620";

    var url = "https://wa.me/" + whatsappNumber + "?text=" + message;

    window.open(url, "_blank");
}

</script>

</body>
</html>
